name: Cargo Publish

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  cargo-publish:
    name: Cargo publish
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0xMiden' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Log release info
        run: |
          echo "Publishing release ${{ github.event.release.tag_name }}"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update

      - name: Publish unpublished crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"

          mapfile -t publishable_crates < <(
            jq -r '[.packages[] | select(.publish != []) | .name] | sort | .[]' <<< "${metadata}"
          )

          exclude_args=()
          remaining_crates=()

          for crate in "${publishable_crates[@]}"; do
            if cargo info --quiet --registry crates-io "${crate}@${version}" >/dev/null 2>&1; then
              echo "${crate} ${version} already exists on crates.io; excluding it."
              exclude_args+=(--exclude "${crate}")
            else
              remaining_crates+=("${crate}")
            fi
          done

          if [[ "${#remaining_crates[@]}" -eq 0 ]]; then
            echo "All publishable crates already exist on crates.io for ${version}."
            exit 0
          fi

          echo "Publishing crates that are not yet on crates.io:"
          printf '  %s\n' "${remaining_crates[@]}"

          cargo publish --workspace "${exclude_args[@]}"

  # Upload the miden-faucet-client CLI as an artifact on the Github release.
  # This is used by midenup to speed installs up.
  upload-artifacts:
    name: upload pre-built miden-faucet-client executable artifacts
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
        exclude:
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - name: Add target
        run: |
          rustup target add ${{ matrix.target }}
      - name: Build miden-faucet-client
        run: |
          BUILD_TARGET=${{ matrix.target }} make build-faucet-client
      - name: Prepare artifact
        run: |
          mv target/${{ matrix.target }}/release/miden-faucet-client miden-faucet-client-${{ matrix.target }}
      - name: Attest miden-faucet-client
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: miden-faucet-client-${{ matrix.target }}
      - name: Upload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload ${RELEASE_TAG} miden-faucet-client-${{ matrix.target }}
